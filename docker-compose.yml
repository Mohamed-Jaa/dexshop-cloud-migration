
services:
  dexshop-redis:
    image: redis:alpine
    container_name: dexshop-redis
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    networks:
      - dex-network

  dexshop-app:
    build: .
    container_name: dexshop-app
    restart: always
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://dexshop-redis:6379/0
    command: gunicorn --workers 3 --bind 0.0.0.0:5000 app:app
    depends_on:
      - dexshop-redis
    networks:
      - dex-network

  dexshop-nginx:
    image: nginx:alpine
    container_name: dexshop-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - dexshop-app
    networks:
      - dex-network

networks:
  dex-network:
    driver: bridge
