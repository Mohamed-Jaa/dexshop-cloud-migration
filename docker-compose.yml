services:
  dexshop-app:
    build: .
    container_name: dexshop-app
    restart: always
    expose:
      - "5000"
    env_file:
      - .env
    networks:
      - dex-network

  dexshop-nginx:
    image: nginx:alpine
    container_name: dexshop-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - dexshop-app
    networks:
      - dex-network

networks:
  dex-network:
    driver: bridge
