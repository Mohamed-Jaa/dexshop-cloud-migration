name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
  id-token: write
  attestations: write
  issues: write

jobs:
  # المرحلة 1: كشف الأسرار
  secrets-scan:
    name: 1. Secrets Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # المرحلة 2: جودة الكود والتنسيق
  code-quality:
    name: 2. Code Quality (Flake8)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 (Syntax & Critical Errors)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # المرحلة 3: الفحص الأمني الثابت للكود
  sast-scan:
    name: 3. SAST Scan (Bandit)
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit SAST Scan
        run: |
          bandit -r . -ll -ii -x ./.venv,./venv,./tests

  # المرحلة 4: فحص ثغرات الحزم والاعتماديات
  sca-scan:
    name: 4. SCA Scan (pip-audit)
    runs-on: ubuntu-latest
    needs: sast-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Run Dependency Vulnerability Scan
        run: |
          pip-audit -r requirements.txt

  # المرحلة 5: فحص ملفات البنية التحتية (Dockerfile Linting)
  iac-scan:
    name: 5. IaC Scan (Hadolint)
    runs-on: ubuntu-latest
    needs: sca-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Hadolint Dockerfile Linter
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  # المرحلة 6: فحص تراخيص الحزم والاعتماديات
  license-check:
    name: 6. License Compliance Check
    runs-on: ubuntu-latest
    needs: iac-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Project Dependencies & pip-licenses
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-licenses

      - name: Check Open Source Licenses
        run: |
          # عرض جدول كامل بجميع التراخيص
          pip-licenses --format=markdown
          # التأكد من عدم وجود تراخيص مقيدة غير مصرح بها
          pip-licenses --fail-on="GPL;AGPL;LGPL"

  # المرحلة 7: فحص أمان صورة الحاوية (Container Security Scanning)
  container-scan:
    name: 7. Container Scan (Trivy)
    runs-on: ubuntu-latest
    needs: license-check
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally
        run: |
          docker build -t dexshop-app:local .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "dexshop-app:local"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL"

          # المرحلة 8: توليد قائمة مكونات البرمجيات (SBOM Generation)
  sbom-generation:
    name: 8. SBOM Generation (Syft)
    runs-on: ubuntu-latest
    needs: container-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t dexshop-app:local .

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          image: dexshop-app:local
          format: spdx-json
          output-file: dexshop-sbom.spdx.json

      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-artifact
          path: dexshop-sbom.spdx.json

    # المرحلة 9: إثبات مصدر ومسار البناء (SLSA Provenance Attestation)
  slsa-provenance:
    name: 9. SLSA Provenance
    runs-on: ubuntu-latest
    needs: sbom-generation
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download SBOM Artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-artifact

      - name: Generate Build Artifact Attestation (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "dexshop-sbom.spdx.json"

          # المرحلة 10: التوقيع الرقمي لصورة الحاوية
  image-signing:
    name: 10. Image Signing (Cosign)
    runs-on: ubuntu-latest
    needs: slsa-provenance
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Save Image
        run: |
          docker build -t dexshop-app:latest .
          docker save dexshop-app:latest -o image.tar

      - name: Generate Keypair and Sign Artifact
        env:
          COSIGN_PASSWORD: "temporary-devsecops-pipeline-secret"
        run: |
          cosign generate-key-pair
          cosign sign-blob --key cosign.key --tlog-upload=false --yes --output-signature image.sig image.tar
          cosign verify-blob --key cosign.pub --signature image.sig --insecure-ignore-tlog=true image.tar

          # المرحلة 11: فرض السياسات ككود (Policy as Code with Conftest)
  policy-check:
    name: 11. Policy as Code (Conftest)
    runs-on: ubuntu-latest
    needs: image-signing
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Conftest
        run: |
          CONFTEST_VERSION="0.56.0"
          wget "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar xzf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          sudo mv conftest /usr/local/bin/
          rm "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"

      - name: Run Conftest against Dockerfile
        run: |
          conftest test Dockerfile -p policy/ --parser dockerfile

      # المرحلة 12: الفحص الأمني الديناميكي (DAST with OWASP ZAP)
  # المرحلة 12: الفحص الأمني الديناميكي (DAST with OWASP ZAP)
  dast-scan:
    name: 12. DAST Scan (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: policy-check
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Run Application
        run: |
          docker build -t dexshop-app:latest .
          # تشغيل الحاوية مع تنفيذ إنشاء الجداول أولاً
          docker run -d --name dexshop-instance -p 5000:5000 -e FLASK_ENV=production dexshop-app:latest sh -c "python -c 'from app import app, db; app.app_context().push(); db.create_all()' && python app.py"
          timeout 30 bash -c 'until [ "$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/)" == "200" ]; do sleep 1; done' || (docker logs dexshop-instance && exit 1)

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:5000"
          issue_title: "OWASP ZAP Security Report"
          fail_action: false

          # المرحلة 13: النشر المستمر ورفع الصورة الموثقة (Continuous Deployment)
  deploy-image:
    name: 13. Publish to Docker Hub (CD)
    runs-on: ubuntu-latest
    needs: dast-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dexshop-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/dexshop-app:${{ github.sha }}

            # المرحلة 14: النشر والتحديث التلقائي على خادم AWS EC2
  deploy-to-ec2:
    name: 14. Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: deploy-image
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. تسجيل الدخول وسحب أحدث صورة تم بناؤها
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/dexshop-app:latest

            # 2. إيقاف وإزالة الحاوية القديمة إن وجدت
            docker stop dexshop-live || true
            docker rm dexshop-live || true

            # 3. تشغيل الحاوية الجديدة بالمنفذ 80 (أو 5000 حسب إعداد السيرفر)
            docker run -d --name dexshop-live --restart always -p 80:5000 ${{ secrets.DOCKERHUB_USERNAME }}/dexshop-app:latest

            # 4. تنظيف الصور القديمة لتوفير المساحة
            docker image prune -af