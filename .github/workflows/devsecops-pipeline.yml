name: DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # المرحلة 1: كشف الأسرار
  secrets-scan:
    name: 1. Secrets Detection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # المرحلة 2: جودة الكود والتنسيق
  code-quality:
    name: 2. Code Quality (Flake8)
    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Run Flake8 (Syntax & Critical Errors)
        run: |
          # فحص الأخطاء البرمجية الحرجة وتوقف المسار إذا وُجدت
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # تنبيهات التنسيق العامة (بدون إيقاف المسار لمنع التعطيل المبكر)
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
