# 1. خادم HTTP: استقبال الزوار وتحويلهم إجبارياً إلى HTTPS
server {
    listen 80;
    server_name dexshop-app.duckdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. خادم HTTPS المشفر: استقبال الزوار بأمان وتمرير الطلبات إلى Flask
server {
    listen 443 ssl;
    server_name dexshop-app.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/dexshop-app.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dexshop-app.duckdns.org/privkey.pem;

    # إعدادات أمان التشفير
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://dexshop-app:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
